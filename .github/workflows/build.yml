name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Host tests (rewriter, hooks, proxy)
        run: ./tests/run.sh
      - name: Build arm64 dylib (iphoneos device SDK)
        run: ./build.sh
      - name: Verify device arm64 Mach-O dylib
        run: |
          set -euo pipefail
          f=build/BTR-iOS.dylib
          file "$f"
          lipo -info "$f"
          file "$f" | grep -q 'Mach-O 64-bit dynamically linked shared library arm64'
          [ "$(lipo -archs "$f")" = "arm64" ]
          # LC_BUILD_VERSION platform 2 = iOS device (7 would be iOS simulator)
          otool -l "$f" | grep -A3 LC_BUILD_VERSION | grep -Eq 'platform (2|IOS)$'
      - uses: actions/upload-artifact@v4
        with:
          name: BTR-iOS-dylib
          path: build/BTR-iOS.dylib
          if-no-files-found: error

  release:
    # Only publish from pushes to main, and only after build + tests succeeded.
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-main
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: BTR-iOS-dylib
          path: dist
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: build-${{ github.run_number }}
          SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          asset=dist/BTR-iOS.dylib
          test -s "$asset"
          short=${SHA:0:7}
          sum=$(sha256sum "$asset" | cut -d' ' -f1)
          size=$(stat -c %s "$asset")
          {
            echo "Automated build from \`main\`."
            echo
            echo "- Commit: ${SHA}"
            echo "- Workflow run: ${GITHUB_SERVER_URL}/${GH_REPO}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Asset: \`BTR-iOS.dylib\` (arm64, iphoneos, ad-hoc signed), ${size} bytes"
            echo "- SHA-256: \`${sum}\`"
            echo
            echo "Install: LiveContainer -> Tweaks -> your folder -> + -> Import Tweak -> BTR-iOS.dylib"
            echo
            echo "### Commit message"
            echo
            echo '```'
            printf '%s\n' "$COMMIT_MSG"
            echo '```'
          } > notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Re-run of the same workflow run: refresh the asset instead of failing.
            gh release upload "$TAG" "$asset" --clobber
            gh release edit "$TAG" --notes-file notes.md --latest
          else
            gh release create "$TAG" "$asset" \
              --target "$SHA" \
              --title "BTR-iOS ${TAG} (${short})" \
              --notes-file notes.md \
              --latest
          fi
